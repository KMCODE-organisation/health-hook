# Health Hook — Home Assistant package
# GENERATED by tools/generate_ha_package.py — edit the generator, not this file.
#
# Setup (see README):
#   1. configuration.yaml:   homeassistant:
#                              packages: !include_dir_named packages
#   2. secrets.yaml:         health_hook_webhook_id: <a long random string, e.g. from `openssl rand -hex 24`>
#   3. Copy this file to /config/packages/health_hook.yaml
#      and homeassistant/health_hook/journal.py to /config/health_hook/journal.py (daily journal, optional).
#   4. Restart Home Assistant, then paste https://<your Home Assistant URL>/api/webhook/<id> in the app.
#
# Payload rules: key absent (metric not selected in the app) = sensor keeps its value; null (selected, no data)
# = 0 for daily totals, unknown otherwise. Attribute `measured_at` = date of the latest sample.

automation:
  - id: health_hook_receive
    alias: Health Hook — receive
    description: >-
      Receives the Health Hook webhook: updates the sensors (event health_hook_received, not for history imports),
      merges the daily values into /config/health_hook/journal.jsonl, and fires health_hook_manual_sync after a
      pull-to-refresh in the app (used by the optional AI summary package).
    mode: queued
    max: 30
    triggers:
      - trigger: webhook
        webhook_id: !secret health_hook_webhook_id
        allowed_methods: [POST]
        local_only: false
    actions:
      - variables:
          payload: "{{ trigger.json if trigger.json is mapping else {} }}"
          source: "{{ payload.get('source', '') }}"
      - if: "{{ source != 'history' }}"
        then:
          - event: health_hook_received
            event_data:
              data: >-
                {% set ns = namespace(x={}) %}{% for k, v in payload.items() if k != 'days' %}{% set ns.x = dict(ns.x, **{k: v}) %}{% endfor %}{{ ns.x }}
      - if: "{{ payload.get('days') | default([], true) | count > 0 }}"
        then:
          - action: shell_command.health_hook_journal
            data:
              b64: "{{ {'days': payload.days} | to_json | base64_encode }}"
            continue_on_error: true
      - if: "{{ source == 'manual' }}"
        then:
          - event: health_hook_manual_sync

  - id: health_hook_app_expiration
    alias: Health Hook — app expiring
    description: >-
      Reminder the day before (and when) the app's signing profile expires (free Apple account: 7 days).
      Change notify.notify to your phone's notify action.
    mode: single
    triggers:
      - trigger: time
        at:
          - entity_id: sensor.health_hook_app_expiration
            offset: "-24:00:00"
        id: day_before
      - trigger: time
        at: sensor.health_hook_app_expiration
        id: expired
    actions:
      - action: notify.notify
        data:
          title: Health Hook
          message: >-
            {% if trigger.id == 'day_before' %}The app expires tomorrow at {{ as_timestamp(states('sensor.health_hook_app_expiration')) | timestamp_custom('%H:%M') }}: reinstall it from Xcode (or let tools/reinstall.sh do it). Already reinstalled? Open it once to update the date.{% else %}The app has expired: it no longer opens or sends data until it is reinstalled from Xcode.{% endif %}

shell_command:
  health_hook_journal: "python3 /config/health_hook/journal.py add {{ b64 }}"
  health_hook_journal_summary: "python3 /config/health_hook/journal.py summary {{ today }} {{ since }}"


# Xcode project generated by XcodeGen: `brew install xcodegen`, then `xcodegen` in this folder.
# Do not edit HealthHook.xcodeproj by hand: change this file and run `xcodegen` again.
#
# ── Set these two values once ─────────────────────────────────────────────────────────────────────────────────
#   BUNDLE_ID_PREFIX  something unique to you (reverse domain), e.g. com.yourname — the app id becomes <prefix>.healthhook
#   DEVELOPMENT_TEAM  your Team ID (Xcode → Signing & Capabilities → Team, then
#                     `grep -m1 DEVELOPMENT_TEAM HealthHook.xcodeproj/project.pbxproj`); a free Apple account works
name: HealthHook
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Xcode normalizes the generated entitlements file during the build; without this: "modified during the build".
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  HealthHook:
    type: application
    platform: iOS
    sources: [HealthHook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthhook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HealthHook/Info.plist
      properties:
        CFBundleDisplayName: Health Hook
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Health Hook reads the Health data you select and sends it to your own Home Assistant. Nothing is sent anywhere else."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).send]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [healthhook]
    entitlements:
      path: HealthHook/HealthHook.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Never paste your webhook URL, your Home Assistant URL or real health data here."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got (status line shown in the app, Home Assistant log lines…).
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: "18.1"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - iOS app
        - Home Assistant package (sensors, journal)
        - AI summary
        - Auto-reinstall script (Mac)
        - Other
    validations:
      required: true
